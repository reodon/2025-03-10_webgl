    <style>
      .buttons-container {
        position: fixed;
        top: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: end;
        gap: 1rem;
        padding: 1rem;
        background-color: rgb(256, 256, 256, 0.5);

          display: flex;
          gap: 1rem;

          }
        }
        > div {
          &:nth-child(2), &:nth-child(3) {

              font-weight: bold;
            }

        }

        .buttons-loading {
          display: none;
          /* pointer-events: none; */
          position: absolute;
          z-index: 10;
          inset: 0;
          width: 100%;
          height: 100%;
          /* background-color: rgb(0, 0, 0, 0.5); */

        }

      details.menu {

          flex-direction: column;

    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://unpkg.com/@tweenjs/tween.js@^23.1.3/dist/tween.umd.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", (e) => {
        const s = document.querySelector('a-cylinder#sigma');
        console.log(s);
        const q = s.object3D.quaternion;
        const target = new THREE.Quaternion();
        const axis = new THREE.Vector3(-1, 0, 1).normalize();
        target.setFromAxisAngle(axis, Math.atan(Math.sqrt(2)));
        q.multiply(target);

        const createSprite = (texture, scale, position) => {
          const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
          // spriteMaterial.transparent = true;
          // spriteMaterial.depthTest = false;
          spriteMaterial.depthWrite = false;
          const sprite = new THREE.Sprite(spriteMaterial);
          sprite.scale.set(scale.x, scale.y, scale.z);
          sprite.position.set(position.x, position.y, position.z);
          sprite.renderOrder = 100;
          // sprite.transparent = true;
          // sprite.depthTest = false;
          return sprite;
        };

        const createCanvasForTexture = (canvasWidth, canvasHeight, text, fontSize) => {
          // 貼り付けるcanvasを作成。
          const canvasForText = document.createElement('canvas');
          const ctx = canvasForText.getContext('2d');
          ctx.canvas.width = canvasWidth; // 小さいと文字がぼやける
          ctx.canvas.height = canvasHeight; // 小さいと文字がぼやける
          // 透過率50%の青背景を描く
          // ctx.fillStyle = 'rgba(0, 0, 255, 0.5)';
          // ctx.fillStyle = 'transparent';
          // ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
          //
          ctx.fillStyle = 'black';
          ctx.font = `${fontSize}px sun-serif`;
          ctx.fillText(
            text,
            // x方向の余白/2をx方向開始時の始点とすることで、横方向の中央揃えをしている。
            (canvasWidth - ctx.measureText(text).width) / 2,
            // y方向のcanvasの中央に文字の高さの半分を加えることで、縦方向の中央揃えをしている。
            canvasHeight / 2 + ctx.measureText(text).actualBoundingBoxAscent / 2
          );
          return canvasForText;
        };

        const addNum = ({
          num,
          position,
        }) => {
          const canvasTexture = new THREE.CanvasTexture(
            createCanvasForTexture(100, 100, String(num), 50)
          );
          // const scaleMaster = 70;
          const scaleMaster = 1;
          const sprite = createSprite(
            canvasTexture,
            {
              x: scaleMaster,
              y: scaleMaster,
              z: scaleMaster,
            },
            position,
            // {x: 1.1, y: 1.1, z: 1.1}
          );
          document.querySelector('a-entity#cube').object3D.add(sprite);
        }

        addNum({
          num: 1, position: {x: -1.1, y: 1.1, z: -1.1}
        });
        addNum({
          num: 1, position: {x: 1.1, y: -1.1, z: 1.1}
        });
        addNum({
          num: 2, position: {x: -1.1, y: 1.1, z: 1.1}
        });
        addNum({
          num: 2, position: {x: 1.1, y: -1.1, z: -1.1}
        });
        addNum({
          num: 3, position: {x: 1.1, y: 1.1, z: 1.1}
        });
        addNum({
          num: 3, position: {x: -1.1, y: -1.1, z: -1.1}
        });
        addNum({
          num: 4, position: {x: 1.1, y: 1.1, z: -1.1}
        });
        addNum({
          num: 4, position: {x: -1.1, y: -1.1, z: 1.1}
        });
      });

      var _ax = {
        x: 1,
        y: 2,
        z: 3,
      };
      var _duration = 1000;
      var _axisColor = false;

      function getAxis(axis) {
        return Array.from("xyz").map((a) => {
          const index = Math.abs(_ax[a]) - 1;
          const sign = Math.sign(_ax[a]);
          return sign * axis[index];
        });
      }

      function setAxis(ax) {
        const pax = {..._ax};
        const paxe = Object.entries(pax).sort((a, b) => Math.abs(a[1]) < Math.abs(b[1]) ? -1 : 1);
        Array.from("xyz").forEach((a, i) => {
          const sign = Math.sign(Number(`${ax[a][0]}1`));
          const nan = ({x: 1, y: 2, z: 3})[ax[a][1]];
          // _ax[a] = sign * pax[na];
          const ca = paxe[i][0];
          const cans = Math.sign(paxe[i][1]);
          _ax[ca] = sign * cans * nan;
        });
        console.log(_ax)
      }

      function f({
        axis,
        to,
        duration,
        selector,
        from,
        conjugation = false,
      }) {
        const _axis = getAxis(axis);
        const elems = document.querySelectorAll(selector);
        const oqs = Array.from(elems).map(elem => elem.object3D.quaternion.clone());
        const {Tween} = TWEEN;
        const angle = {a: from};
        const tween = new Tween(angle, false)
          .to({a: to}, duration)
          .onUpdate(() => {
            elems.forEach((elem, i) => {
              const quaternion = elem.object3D.quaternion;
              const target = new THREE.Quaternion();
              const _a = new THREE.Vector3(..._axis).normalize();
              target.setFromAxisAngle(_a, angle.a);
              quaternion.multiplyQuaternions(oqs[i], conjugation ? target.conjugate() : target);
            })
          })
          .start();

        const animate = (time) => {
          tween.update(time);
          requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);
      }

      function busy(flag, axisColor = undefined) {
        if (flag) {
          document.body.style.pointerEvents = 'none';
          document.body.style.cursor = 'wait';
          document.querySelector('.buttons-loading').style.display = 'block';
          if (axisColor && _axisColor) {
            const axis = document.querySelector(`a-entity#axes a-cylinder[color='${axisColor}']`);
            axis.setAttribute('depth-test', true);
            axis.setAttribute('opacity', '1');
          }
        } else {
          document.body.style.pointerEvents = 'auto';
          document.body.style.cursor = 'auto';
          document.querySelector('.buttons-loading').style.display = 'none';
          if (axisColor) {
            const axis = document.querySelector(`a-entity#axes a-cylinder[color='${axisColor}']`);
            axis.setAttribute('depth-test', false);
            axis.setAttribute('opacity', '0.5');
          }
        }
      }

      function ff({
        axis,
        to,
        ax = {x: '+x', y: '+y', z: '+z'},
        elm,
        selector = 'a-entity#cube',
        from = 0,
        duration = undefined,
        axisColor = undefined,
      }) {
        busy(true, axisColor);

        if (elm) {
          const out = document.querySelector('textarea#out');
          const values = [...out.value];
          console.log(values);
          if (elm === values[0]) {
            if (values.length === 1) {
              out.value = elm + (2);
            } else {
              const index = values.slice(1).findIndex(c => {
                const charCode = c.charCodeAt(0);
                return charCode < 0x30 || 0x39 < charCode;
              });

              if (index === -1) {
                out.value = elm + (Number(values.slice(1).join('')) + 1);
              } else if (index === 0) {
                out.value = elm + (2) + values.slice(index + 1).join('');
              } else {
                out.value = elm + (Number(values.slice(1, index + 1).join('')) + 1) + values.slice(index + 1).join('');
              }
            }
          } else {
            out.value = elm + out.value;
          }
        }

        f({
          selector,
          axis,
          to,
          from,
          duration: duration ?? _duration,
        });

        setTimeout(() => {
          setAxis(ax);
          busy(false, axisColor);

          // f({
          //   selector: 'a-text',
          //   axis,
          //   to: -1 * to,
          //   // to,
          //   // conjugation: true,
          //   from,
          //   duration: duration / 3,
          // });

          // setTimeout(() => {
          //   setAxis(ax);
          //   document.body.style.pointerEvents = 'auto';
          // }, duration / 3);
        }, duration ?? _duration);
      }
    </script>

              })()"

        </div>
      </details>

      <div class="buttons-loading"></div>

  </body>
</html>
